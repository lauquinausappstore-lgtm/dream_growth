<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>《遊戲治療》閱讀理解評分小助手</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#203b35;background:#f5f8f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:24px 16px 50px}header{background:#dcefe2;border-radius:18px;padding:24px}h1{font-size:1.65rem;margin:0 0 8px}h2{font-size:1.1rem;margin:0 0 12px}.card{background:white;border:1px solid #dce7dc;border-radius:16px;padding:20px;margin-top:16px;box-shadow:0 2px 8px #29472b0b}.hint{color:#536c60;font-size:.92rem}textarea{width:100%;min-height:115px;resize:vertical;padding:13px;border:1px solid #a9c2b1;border-radius:10px;font:inherit;line-height:1.7}button{cursor:pointer;font:inherit;border:0;border-radius:11px;padding:12px 18px;background:#246b4d;color:white;font-weight:700}button.secondary{background:#e5f1e8;color:#205b43}button:focus-visible,textarea:focus-visible{outline:3px solid #e6b85e}details{line-height:1.85}summary{cursor:pointer;font-weight:700}.article{white-space:pre-wrap;line-height:2;font-size:.96rem}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.score{font-size:2rem;font-weight:800;color:#236a49}.criteria{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.criteria>div{border:1px solid #d7e6da;background:#f6faf6;padding:12px;border-radius:10px}.criteria strong{display:block;margin-bottom:6px}.criteria .reason{display:block;margin-top:9px;line-height:1.65;font-size:.9rem;color:#38564b}.criteria .status{font-weight:700;color:#246b4d}label{display:block;font-weight:700;margin-bottom:8px}#result[hidden]{display:none}.warn{color:#925c12;background:#fff8e8;padding:10px;border-radius:8px}.foot{font-size:.84rem;color:#596b60;margin-top:16px}@media(max-width:580px){.criteria{grid-template-columns:1fr}h1{font-size:1.4rem}}</style></head><body><main class="wrap"><header><h1>📖 閱讀理解評分小助手</h1><div>《遊戲治療》｜自設問題・答案評價・3分準則</div><p class="hint">文章已內置，毋須上傳照片或輸入姓名。此版本可離線使用。</p></header><section class="card"><details><summary>閱讀原文（點擊展開）</summary><p class="article" id="article"></p></details></section><section class="card"><h2>① 輸入自設題目</h2><label for="question">你的問題</label><textarea id="question" placeholder="例：你認為遊戲治療能幫助兒童表達情緒嗎？請結合文章說明。"></textarea></section><section class="card"><h2>② 輸入同學答案</h2><label for="answer">同學的答案</label><textarea id="answer" placeholder="請在這裏輸入答案……"></textarea></section><section class="card"><h2>③ 評價得分</h2><p class="hint">每項最多1分。評分結果會逐項列出「得分、判斷原因、改善建議」。本工具只作規則比對，並非AI正式批改。</p><div class="row"><button id="grade">評價得分（0–3分）</button><button class="secondary" id="clear" type="button">清除內容</button></div></section><section class="card" id="result" hidden aria-live="polite"><h2>評分結果</h2><p>初步參考總分：<span class="score" id="total"></span> / 3</p><div class="criteria" id="criteria"></div><p id="suggest"></p><p class="warn">⚠️ 此版本採用本機規則比對，無法可靠理解所有不同措辭、判斷引文是否真正支持立場，亦可能誤判。請由學生或教師依照原文及評分準則作最終判斷。</p></section><p class="foot">私隱：題目與答案只在此頁面內處理，不會上傳伺服器或儲存。請勿輸入學生姓名等個人資料。</p></main><script>
const article=`相信沒有孩子不愛玩耍，孩子可通過遊戲表達他們對現實世界的想法、抒發感受，從而令他們快樂，減低焦慮情緒。因此，有專業人士創立遊戲治療，以遊戲的方式幫助受助兒童解決心理、情緒或行為偏差問題。

遊戲治療並不是漫無目的地玩耍，而是將治療元素加入遊戲情境中。治療師必須受過良好的遊戲治療訓練，知道如何選擇遊戲器材，並遵守特定的治療準則。首先，治療師須安排受助兒童在玩具治療室玩遊戲，治療室須設在能保障兒童私隱的位置，目的是讓他們感覺安全、不受打擾。接着，與兒童建立信任的關係，治療師必須進入兒童的世界，跟隨他們的行為，使用溫柔、友善、和緩的方式回應，讓兒童感覺得到治療師的接納。最後，要選取適合的遊戲方式。由於兒童的語言或思考能力尚未完全發展，有時難以用合適的言詞說出自己的感受或經歷，治療師要引導兒童利用玩具和創作自由地表達情感、想法或經歷，從而抒解鬱積的情緒。

遊戲有奇妙的療癒力量，可以讓人在一個放鬆的場景，將心裏的情緒釋放出來，提升正向的情感，甚至自我解難的能力。如有自閉症孩子經常發脾氣，治療師就利用他喜歡玩的象棋，讓他學會遵守規則和面對失敗；焦慮的兒童對身邊事情都有過於緊張的反應，但在黏土遊戲中，能自由自在地把黏土塑造出五花八門的形狀，通過遊戲穩定情緒。

很多人都認為「勤有功，戲無益」，其實遊戲並不一定浪費時間，甚至有超乎想像的治療功能。遊戲治療能令兒童有更完整的身心發展：他們在遊戲中能重新整理自己經歷和情緒，並學習生活中的責任和與別人相處的技巧。遊戲可幫助他們建立不一樣的生命。`;
document.getElementById('article').textContent=article;
const concepts=[['表達情緒','抒發感受','釋放情緒','表達感受','情緒','焦慮','鬱積'],['治療師','接納','信任','安全','私隱','治療'],['象棋','遵守規則','面對失敗','自閉症'],['黏土','穩定情緒','緊張'],['責任','相處','身心發展','解難','生命']];
const stance=/我(認為|覺得|相信|同意|不同意|會|不會|贊成|反對|支持)|我(的)?看法|應該|不應該|可以|不可以|值得|不值得|有幫助|沒有幫助|能夠|不能夠/;
const reasoning=/因為|由於|原因|所以|因此|這樣|可見|反映|說明|證明|令|使|從而|有助|有利|例如|比如|以致/;
const quote=/文中|文章|根據|作者|提到|指出|例如|譬如|如文中所述|書中/;
function evaluate(q,a){let hits=concepts.flatMap(group=>group.filter(term=>a.includes(term)));let specific=hits.filter(s=>s.length>=3);let stanceScore=stance.test(a)?1:0;let citationScore=(quote.test(a)&&hits.length>0)||(specific.length>=2&&hits.length>=3)?1:0;let explainScore=reasoning.test(a)&&a.length>=25?1:0;let open=/你認為|你覺得|你會|你是否|你同意|你贊成|你的看法|為甚麼|為什麼|試結合|請結合|你支持/.test(q);return {scores:[stanceScore,citationScore,explainScore],open,hits:[...new Set(hits)]};}
const labels=['表態','引文','解釋'];const descriptions=['是否清楚表達個人立場','是否引用或準確轉述文章內容','是否解釋內容如何支持立場'];
document.getElementById('grade').onclick=()=>{const q=document.getElementById('question').value.trim(),a=document.getElementById('answer').value.trim();if(!q||!a){alert('請先輸入題目及答案。');return;}let {scores,open,hits}=evaluate(q,a);let total=scores.reduce((x,y)=>x+y,0);document.getElementById('total').textContent=total;const reasons=[
 scores[0]?'答案出現了表達立場的字句，例如「我認為／可以／應該」等。':'未找到明確表達立場的常見字句。',
 scores[1]?'答案包含與文章相關的概念，並符合本工具的引用線索規則；仍須人工核對是否真正引用原文。':'未找到足夠的文章引用線索或具體內容。',
 scores[2]?'答案包含解釋性連接詞，並達到基本字數要求；仍須人工判斷推論是否合理。':'未同時符合解釋性連接詞及基本字數條件。'
];
 const improvements=[
 '可用「我認為……」清楚表達贊成或反對的立場。',
 '可引用文章中象棋、黏土或治療師與兒童建立信任的具體例子。',
 '可補充「這個例子如何支持我的看法」，避免只重複文章內容。'
 ];
 document.getElementById('criteria').innerHTML=labels.map((x,i)=>`<div><strong>${x}：<span class="status">${scores[i]} / 1分</span></strong><small>${descriptions[i]}</small><span class="reason">判斷原因：${reasons[i]}</span><span class="reason">${scores[i]?'核對提醒':'改善建議'}：${scores[i]?'請對照題目及原文，確認這項確實符合準則。':improvements[i]}</span></div>`).join('');let tips=[];if(!open)tips.push('題目未明確顯示為個人看法題，請先確認是否適用三項準則。');if(!scores[0])tips.push('請明確寫出「我認為……」，表達個人立場。');if(!scores[1])tips.push('請從原文引用或準確轉述一項具體資料，例如象棋、黏土或治療師接納兒童的例子。');if(!scores[2])tips.push('請用「因為……所以……」解釋所選內容如何支持你的立場。');if(tips.length===0)tips.push('答案可能具備三項元素，仍須檢查引文是否準確，以及解釋是否切題。');document.getElementById('suggest').textContent='檢查建議：'+tips.join(' ');document.getElementById('result').hidden=false;document.getElementById('result').scrollIntoView({behavior:'smooth'});};document.getElementById('clear').onclick=()=>{document.getElementById('question').value='';document.getElementById('answer').value='';document.getElementById('result').hidden=true;};
</script></body></html>
